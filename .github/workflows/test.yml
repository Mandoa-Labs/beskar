name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build
        run: cargo build --verbose

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build with optional format features (docx, pdf)
        run: cargo build --features docx,pdf --verbose

      - name: Run unit tests with optional format features (docx, pdf)
        run: cargo test --features docx,pdf --verbose

      - name: Smoke-test CLI parsing (--help on every subcommand)
        run: |
          ./target/debug/beskar --help
          ./target/debug/beskar init --help
          ./target/debug/beskar db --help
          ./target/debug/beskar document --help
          ./target/debug/beskar generate --help

      - name: Smoke-test no-flag db path
        run: ./target/debug/beskar db
