name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        # No explicit version here: rustup honors rust-toolchain.toml and
        # auto-installs the pinned channel on first cargo/rustc invocation, so
        # CI builds with the same compiler as releases (PRD §12.6, issue #58).
        run: |
          rustup show
          cargo --version
          rustc --version

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      # --locked fails closed if Cargo.lock and Cargo.toml disagree, which is
      # what makes the committed lockfile a reproducibility guarantee (#58).
      - name: Build
        run: cargo build --locked --verbose

      - name: Run unit tests
        run: cargo test --locked --verbose

      - name: Build with optional format features (docx, pdf)
        run: cargo build --locked --features docx,pdf --verbose

      - name: Run unit tests with optional format features (docx, pdf)
        run: cargo test --locked --features docx,pdf --verbose

      - name: Smoke-test CLI parsing (--help on every subcommand)
        run: |
          ./target/debug/beskar --help
          ./target/debug/beskar init --help
          ./target/debug/beskar db --help
          ./target/debug/beskar document --help
          ./target/debug/beskar generate --help
          ./target/debug/beskar config --help
          ./target/debug/beskar config lint --help
          ./target/debug/beskar version --help

      - name: Smoke-test no-flag db path
        run: ./target/debug/beskar db

      - name: Verify `version` reports FIPS state (E1.9)
        run: |
          out="$(./target/debug/beskar version)"
          echo "$out"
          echo "$out" | grep -q '^beskar ' || { echo "::error::version line missing"; exit 1; }
          # The default build is not a FIPS build, so it must say so rather than
          # claim validated crypto.
          echo "$out" | grep -q 'FIPS mode: unavailable' || {
            echo "::error::expected FIPS-unavailable status on a standard build"; exit 1; }

      - name: Verify secrets are redacted from --verbose output (E1.3)
        run: |
          mkdir -p "$HOME/.config/beskar"
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: SENTINELPATVALUE0001
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: SENTINELPGPASSWORD0002
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"
          # --offline + --verbose prints the effective (redacted) config, then
          # fails closed before any network egress. We only care about stderr.
          ./target/debug/beskar generate --query hi --table-name t --offline --verbose \
            > /dev/null 2> verbose.txt || true
          echo "--- captured stderr ---"; cat verbose.txt
          if grep -qE 'SENTINELPATVALUE0001|SENTINELPGPASSWORD0002' verbose.txt; then
            echo "::error::a plaintext secret leaked into --verbose/error output"; exit 1
          fi
          grep -q 'REDACTED' verbose.txt || { echo "::error::expected redaction marker not found"; exit 1; }

      - name: Verify config lint exits non-zero on plaintext secrets + lax mode (E1.2)
        run: |
          mkdir -p "$HOME/.config/beskar"
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: PLAINTEXTPAT0001
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: PLAINTEXTPG0002
          EOF
          chmod 644 "$HOME/.config/beskar/config.yaml"  # deliberately lax
          if ./target/debug/beskar config lint; then
            echo "::error::config lint should exit non-zero on plaintext secrets / lax mode"; exit 1
          fi

      - name: Verify redaction hooks are validated + fail closed (E1.11)
        run: |
          mkdir -p "$HOME/.config/beskar"
          # Valid: enabled with built-in presets + a custom pattern; secrets are
          # references (not literals) and perms are tight, so lint has no findings
          # and must report the active redaction rules and exit zero.
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: env://OPENAI_API_KEY
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: env://PGPASSWORD
          redaction:
            enabled: true
            presets: [email, us-ssn]
            patterns:
              - name: employee-id
                regex: 'EMP-\d{6}'
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"
          out="$(./target/debug/beskar config lint)"; echo "$out"
          echo "$out" | grep -q 'redaction] enabled with rules' || {
            echo "::error::config lint did not report the active redaction rules"; exit 1; }

          # Invalid regex must fail closed: non-zero exit, naming the bad rule,
          # rather than silently embedding unredacted text.
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: env://OPENAI_API_KEY
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: env://PGPASSWORD
          redaction:
            enabled: true
            patterns:
              - name: broken
                regex: '('
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"
          set +e
          out="$(./target/debug/beskar config lint 2>&1)"; code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::lint should exit non-zero on an invalid redaction regex"; exit 1; }
          echo "$out" | grep -q 'invalid redaction regex' || {
            echo "::error::expected an 'invalid redaction regex' finding"; exit 1; }

      - name: Verify `db --verify` is wired and validates its args (E1.12)
        run: |
          # No PostgreSQL on the runner, so this exercises the CLI wiring and the
          # arg-validation path (which runs before any DB connection). The full
          # integrity check is covered by docs/backup-restore.md against a real DB.
          mkdir -p "$HOME/.config/beskar"
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: LITERALPAT000000001
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: LITERALPG0000000002
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"
          ./target/debug/beskar db --help | grep -q -- '--verify' || {
            echo "::error::db --verify flag is not wired into the CLI"; exit 1; }
          # --verify without --table-name must fail closed with a clear message,
          # before attempting to connect to a database.
          set +e
          out="$(./target/debug/beskar db --verify 2>&1)"; code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::db --verify without --table-name should exit non-zero"; exit 1; }
          echo "$out" | grep -q 'table-name is required' || {
            echo "::error::expected a clear --table-name-required message"; exit 1; }

      - name: Verify compliance appendix covers every E1 control (§11)
        run: |
          # Docs-only check: the SOC 2 / 800-53 control-mapping appendix must map
          # every E1 control, so it can't silently drift as controls change.
          doc=docs/control-mapping.md
          test -f "$doc" || { echo "::error::$doc is missing"; exit 1; }
          for n in $(seq 1 12); do
            grep -qF "**E1.$n**" "$doc" || {
              echo "::error::control-mapping appendix is missing E1.$n"; exit 1; }
          done
          grep -qF 'SOC 2' "$doc" && grep -qF '800-53' "$doc" || {
            echo "::error::appendix must reference both SOC 2 and NIST 800-53"; exit 1; }
          echo "control-mapping appendix covers E1.1-E1.12"

      - name: Verify `beskar serve` auth + health (E2.1)
        run: |
          # No PostgreSQL on the runner, so this exercises serving, the
          # fail-closed-without-a-token guard, and bearer auth on the /health and
          # 401 paths (which don't touch the DB). Ingest/query against a real DB
          # are documented in docs/server.md.
          mkdir -p "$HOME/.config/beskar"
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: LITERALPAT000000001
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: LITERALPG0000000002
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"

          # 1. Fails closed when no token is configured (errors before binding).
          set +e
          out="$(./target/debug/beskar serve --addr 127.0.0.1:8724 2>&1)"; code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::serve without a token should exit non-zero"; exit 1; }
          echo "$out" | grep -q 'requires an API token' || {
            echo "::error::expected an API-token-required message"; exit 1; }

          # 2. With a token, it serves /health and enforces bearer auth.
          ./target/debug/beskar serve --addr 127.0.0.1:8724 --token testtoken123 \
            > /tmp/serve.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8724/health 2>/dev/null; then break; fi
            sleep 0.3
          done
          health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8724/health)
          noauth=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8724/v1/query -d '{}')
          wrong=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer nope' -X POST http://127.0.0.1:8724/v1/query -d '{}')
          kill "$SRV" 2>/dev/null || true
          echo "--- serve.log ---"; cat /tmp/serve.log
          echo "health=$health noauth=$noauth wrong=$wrong"
          [ "$health" = 200 ] || { echo "::error::/health should be 200"; exit 1; }
          [ "$noauth" = 401 ] || { echo "::error::unauthenticated query should be 401"; exit 1; }
          [ "$wrong"  = 401 ] || { echo "::error::wrong-token query should be 401"; exit 1; }

      - name: Verify central policy is enforced server-side for every caller (E2.6)
        run: |
          mkdir -p "$HOME/.config/beskar"

          # 1. A policy denying the configured provider must 403 every caller
          #    (the default provider is openai), before any DB access.
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: LITERALPAT000000001
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: LITERALPG0000000002
          policy:
            deny_providers: [openai]
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"
          ./target/debug/beskar serve --addr 127.0.0.1:8725 --token testtok > /tmp/serve-policy.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8725/health 2>/dev/null; then break; fi
            sleep 0.3
          done
          q=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer testtok' -X POST http://127.0.0.1:8725/v1/query  -d '{"table_name":"kb","query":"hi"}')
          ing=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer testtok' -X POST http://127.0.0.1:8725/v1/ingest -d '{"table_name":"kb","filename":"a.md","content":"x"}')
          pol=$(curl -s -H 'Authorization: Bearer testtok' http://127.0.0.1:8725/v1/policy)
          kill "$SRV" 2>/dev/null || true
          echo "--- serve-policy.log ---"; cat /tmp/serve-policy.log
          echo "query=$q ingest=$ing policy=$pol"
          [ "$q"   = 403 ] || { echo "::error::denied-provider query should be 403 for every caller"; exit 1; }
          [ "$ing" = 403 ] || { echo "::error::denied-provider ingest should be 403 for every caller"; exit 1; }
          echo "$pol" | grep -q 'deny_providers' || { echo "::error::/v1/policy should report the active policy"; exit 1; }

          # 2. require_redaction with redaction disabled must fail closed at startup.
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: LITERALPAT000000001
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: LITERALPG0000000002
          policy:
            require_redaction: true
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"
          set +e
          out="$(./target/debug/beskar serve --addr 127.0.0.1:8726 --token testtok 2>&1)"; code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::serve must fail closed when policy requires redaction but it is off"; exit 1; }
          echo "$out" | grep -q 'requires redaction' || { echo "::error::expected a require-redaction message"; exit 1; }

      - name: Verify audit log emits one redacted, schema-valid event (E1.8)
        run: |
          mkdir -p "$HOME/.config/beskar"
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: SENTINELAUDITSECRET0001
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: SENTINELAUDITPW0002
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"
          export BESKAR_AUDIT_FILE="$PWD/audit.log"
          rm -f "$PWD/audit.log"
          # An --offline generate fails closed before any egress, producing
          # exactly one 'generate' failure event in the audit log.
          ./target/debug/beskar generate --query hi --table-name notes --offline \
            > /dev/null 2>&1 || true
          echo "--- audit.log ---"; cat audit.log
          if [ "$(grep -c . audit.log)" -ne 1 ]; then
            echo "::error::expected exactly one audit event"; exit 1
          fi
          if grep -qE 'SENTINELAUDITSECRET0001|SENTINELAUDITPW0002' audit.log; then
            echo "::error::a plaintext secret leaked into the audit log"; exit 1
          fi
          # Validate the emitted event(s) against the published JSON Schema, in
          # an isolated venv so the check works regardless of the runner's
          # externally-managed system Python (PEP 668).
          python3 -m venv /tmp/schema-venv
          /tmp/schema-venv/bin/pip install --quiet jsonschema
          /tmp/schema-venv/bin/python - <<'PY'
          import json, sys
          from jsonschema import Draft202012Validator

          schema = json.load(open("docs/audit-log.schema.json"))
          validator = Draft202012Validator(schema)
          count = 0
          with open("audit.log") as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  count += 1
                  event = json.loads(line)
                  errors = sorted(validator.iter_errors(event), key=lambda e: list(e.path))
                  if errors:
                      for err in errors:
                          print(f"::error::audit event violates schema: {err.message}")
                      sys.exit(1)
          if count != 1:
              print(f"::error::expected exactly one audit event, got {count}")
              sys.exit(1)
          print(f"validated {count} audit event(s) against docs/audit-log.schema.json")
          PY

      - name: Verify SSO / RBAC / tenant isolation enforced server-side (E2.2/E2.3/E2.5)
        run: |
          set -e
          mkdir -p "$HOME/.config/beskar"
          # pgport points at a closed port so any request that *passes* authz
          # fails fast at DB connect (500) — there is no Postgres on the runner.
          cat > "$HOME/.config/beskar/config.yaml" <<'EOF'
          pat: LITERALPAT000000001
          pghost: 127.0.0.1
          pguser: u
          pgport: "5499"
          pgdatabase: d
          pgpassword: LITERALPG0000000002
          auth:
            session_secret: test-session-secret
            session_ttl_secs: 900
            oidc:
              issuer: "https://idp.test/"
              audience: beskar
              hs256_secret: idp-shared-secret
              tenant_claim: tenant
              roles_claim: groups
              role_map:
                beskar-admins: { role: admin }
                kb-readers: { role: reader, corpus: kb }
            principals:
              - token: reader-token-aaaa
                subject: reader-bot
                tenant: acme
                roles: { "*": reader }
              - token: author-token-bbbb
                subject: author-bot
                tenant: acme
                roles: { kb: author }
              - token: scoped-token-cccc
                subject: scoped-bot
                tenant: acme
                roles: { kb: reader }
          EOF
          chmod 600 "$HOME/.config/beskar/config.yaml"

          # New CLI surface is wired.
          ./target/debug/beskar login --help | grep -q -- '--id-token' || {
            echo "::error::login --id-token is not wired"; exit 1; }
          ./target/debug/beskar generate --help | grep -q -- '--corpus' || {
            echo "::error::generate --corpus (client mode) is not wired"; exit 1; }

          ./target/debug/beskar serve --addr 127.0.0.1:8730 --token admintok123 \
            > /tmp/serve-m9.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8730/health 2>/dev/null; then break; fi
            sleep 0.3
          done
          # Server came up => the `auth` block (principals + OIDC) compiled.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8730/health)" = 200 ] || {
            echo "::error::serve did not start with an auth block"; cat /tmp/serve-m9.log; exit 1; }

          code() { # METHOD PATH TOKEN BODY
            if [ -n "$3" ]; then
              curl -s -o /dev/null -w '%{http_code}' -X "$1" -H "Authorization: Bearer $3" \
                -H 'Content-Type: application/json' -d "$4" "http://127.0.0.1:8730$2"
            else
              curl -s -o /dev/null -w '%{http_code}' -X "$1" \
                -H 'Content-Type: application/json' -d "$4" "http://127.0.0.1:8730$2"
            fi
          }
          ingest='{"corpus":"kb","filename":"a.md","content":"x"}'
          cbody='{"corpus":"kb"}'

          noauth=$(code POST /v1/ingest "" "$ingest")
          reader_ingest=$(code POST /v1/ingest reader-token-aaaa "$ingest")
          author_ingest=$(code POST /v1/ingest author-token-bbbb "$ingest")
          author_admin=$(code POST /v1/admin/corpus/create author-token-bbbb "$cbody")
          admin_admin=$(code POST /v1/admin/corpus/create admintok123 "$cbody")
          scoped_other=$(code POST /v1/query scoped-token-cccc '{"corpus":"other","query":"hi"}')
          whoami=$(curl -s -H 'Authorization: Bearer reader-token-aaaa' http://127.0.0.1:8730/v1/whoami)
          echo "noauth=$noauth reader_ingest=$reader_ingest author_ingest=$author_ingest author_admin=$author_admin admin_admin=$admin_admin scoped_other=$scoped_other"
          echo "whoami=$whoami"

          [ "$noauth" = 401 ]        || { echo "::error::unauthenticated request must be 401"; exit 1; }
          # RBAC: a reader cannot ingest; an author cannot administer (E2.3).
          [ "$reader_ingest" = 403 ] || { echo "::error::reader must not ingest"; exit 1; }
          [ "$author_admin" = 403 ]  || { echo "::error::author must not administer a corpus"; exit 1; }
          # Authorized actions pass RBAC and reach the (absent) DB => 500, not 403.
          [ "$author_ingest" = 500 ] || { echo "::error::author ingest should pass RBAC (got $author_ingest)"; exit 1; }
          [ "$admin_admin" = 500 ]   || { echo "::error::admin corpus-create should pass RBAC (got $admin_admin)"; exit 1; }
          # Tenant/scope isolation: a principal cannot touch a corpus it has no
          # grant on, and the tenant comes from the token, not the request (E2.5).
          [ "$scoped_other" = 403 ]  || { echo "::error::scoped principal reached a non-granted corpus"; exit 1; }
          echo "$whoami" | grep -q '"tenant":"acme"' || { echo "::error::/v1/whoami must report the authenticated tenant"; exit 1; }
          echo "$whoami" | grep -q 'reader' || { echo "::error::/v1/whoami must report the role"; exit 1; }

          # SSO (E2.2): mint an OIDC ID token the way an IdP would (HS256), exchange
          # it at /v1/login for a short-lived beskar session token, and use it.
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          hdr=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
          pl=$(printf '%s' '{"iss":"https://idp.test/","aud":"beskar","sub":"alice","tenant":"acme","groups":["beskar-admins"],"exp":4102444800}' | b64url)
          sig=$(printf '%s' "$hdr.$pl" | openssl dgst -sha256 -hmac 'idp-shared-secret' -binary | b64url)
          idtoken="$hdr.$pl.$sig"

          login_resp=$(curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"id_token\":\"$idtoken\"}" http://127.0.0.1:8730/v1/login)
          echo "login_resp=$login_resp"
          echo "$login_resp" | grep -q '"subject":"alice"' || {
            echo "::error::/v1/login must validate the IdP token and return the subject"; exit 1; }
          session=$(printf '%s' "$login_resp" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          [ -n "$session" ] || { echo "::error::/v1/login did not return a session token"; exit 1; }
          # The short-lived session token authenticates at a protected endpoint and
          # carries the SSO-derived tenant.
          sess_whoami=$(curl -s -H "Authorization: Bearer $session" http://127.0.0.1:8730/v1/whoami)
          echo "sess_whoami=$sess_whoami"
          echo "$sess_whoami" | grep -q '"tenant":"acme"' || {
            echo "::error::SSO session token must carry the tenant"; exit 1; }
          # A forged ID token (bad signature) is rejected at login.
          bad_login=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d "{\"id_token\":\"$hdr.$pl.badsig\"}" http://127.0.0.1:8730/v1/login)
          [ "$bad_login" = 401 ] || { echo "::error::forged ID token must be 401 (got $bad_login)"; exit 1; }

          kill "$SRV" 2>/dev/null || true
          echo "--- serve-m9.log ---"; cat /tmp/serve-m9.log

      - name: Verify Ollama provider wiring — unattended init, egress auto-allow, preflight (OL.1/OL.4)
        run: |
          set -e
          mkdir -p "$HOME/.config/beskar"
          cfg="$HOME/.config/beskar/config.yaml"

          # 1. `beskar init` writes a complete Ollama config with zero prompts from
          #    flags/env, and needs no OpenAI key when both sides use Ollama (E1.10).
          rm -f "$cfg"
          BESKAR_EMBED_PROVIDER=ollama BESKAR_PROVIDER=ollama \
          OLLAMA_HOST=http://ollama.internal:11434 \
          PGHOST=db.internal PGUSER=beskar PGPASSWORD=pw \
            ./target/debug/beskar init --non-interactive
          echo "--- written config ---"; cat "$cfg"
          grep -q '^provider: ollama'                          "$cfg" || { echo "::error::init did not set provider: ollama"; exit 1; }
          grep -q '^ollama_host: http://ollama.internal:11434' "$cfg" || { echo "::error::init did not record ollama_host"; exit 1; }
          grep -q '^  provider: ollama'                        "$cfg" || { echo "::error::init did not write the embed ollama block"; exit 1; }
          if grep -q '^pat:' "$cfg"; then echo "::error::an Ollama-only init must not write an OpenAI pat"; exit 1; fi

          # 2. Egress auto-allow (OL.1) + preflight (OL.4): with a local Ollama host
          #    and --offline, the request is NOT blocked by the allowlist (the host
          #    is auto-added); it fails instead with a clear "could not reach Ollama"
          #    preflight error, since nothing is listening on the runner.
          cat > "$cfg" <<'EOF'
          provider: ollama
          embed:
            provider: ollama
          ollama_host: http://127.0.0.1:11434
          pghost: localhost
          pguser: u
          pgport: "5432"
          pgdatabase: d
          pgpassword: env://PGPASSWORD
          EOF
          chmod 600 "$cfg"
          export PGPASSWORD=whatever
          set +e
          out="$(./target/debug/beskar generate --query hi --table-name t --offline 2>&1)"; code=$?
          set -e
          echo "--- generate output ---"; echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::generate against an absent Ollama should fail"; exit 1; }
          echo "$out" | grep -q 'could not reach Ollama' || {
            echo "::error::expected a clear Ollama-unreachable preflight error"; exit 1; }
          if echo "$out" | grep -q 'offline mode: refusing connection'; then
            echo "::error::--offline blocked the auto-allowed Ollama host (egress auto-allow regressed)"; exit 1
          fi

      # Kept last: this rebuilds target/debug/beskar with FIPS enabled, which
      # fails closed on a runner that has no FIPS provider — so it must run after
      # the standard-binary smoke tests above, not before them.
      - name: Build with FIPS feature (E1.9)
        # The OpenSSL FIPS provider only has to exist at runtime, not to compile,
        # so this catches build breakage in the `--features fips` code path.
        run: cargo build --locked --features fips --verbose

      - name: Verify a FIPS build fails closed without a provider (E1.9)
        run: |
          # The runner has no FIPS provider installed, so a FIPS build must
          # report the module inactive and refuse to do real work rather than
          # silently fall back to non-validated crypto.
          out="$(./target/debug/beskar version)"; echo "$out"
          echo "$out" | grep -q 'FIPS mode: inactive' || {
            echo "::error::FIPS build should report inactive when no provider is present"; exit 1; }
          if ./target/debug/beskar db; then
            echo "::error::FIPS build should fail closed (non-zero) when the provider is unavailable"; exit 1
          fi

  supply-chain:
    name: Supply chain (vuln + license gates)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      # License + source policy is enforced by cargo-deny against deny.toml.
      # Advisories are intentionally delegated to cargo-audit below (see the
      # note in deny.toml), so this gate covers bans, licenses, and sources.
      - name: License & source gate (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      # Vulnerability gate: scan the committed Cargo.lock against the RustSec
      # advisory database. Built from source for determinism, matching how the
      # release workflow installs its packaging tools.
      - name: Vulnerability gate (cargo-audit / RustSec advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit
