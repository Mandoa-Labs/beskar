name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb-build-packages:
    name: Build Debian (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libssl-dev pkg-config

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build Debian package
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
        run: |
          mkdir -p target/${{ matrix.rust_target }}/debian
          cargo deb \
            --target ${{ matrix.rust_target }} \
            --no-strip \
            --output target/${{ matrix.rust_target }}/debian/beskar-debian-${{ matrix.arch }}.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package-${{ matrix.arch }}
          path: target/${{ matrix.rust_target }}/debian/*.deb

  rpm-build-packages:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build binary
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Strip binary
        run: strip target/${{ matrix.rust_target }}/release/beskar

      - name: Build RPM package
        run: |
          mkdir -p target/${{ matrix.rust_target }}/generate-rpm
          cargo generate-rpm \
            --target ${{ matrix.rust_target }} \
            --output target/${{ matrix.rust_target }}/generate-rpm/beskar-rpm-${{ matrix.arch }}.rpm

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package-${{ matrix.arch }}
          path: target/${{ matrix.rust_target }}/generate-rpm/*.rpm

  macos-build-packages:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            rust_target: x86_64-apple-darwin

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.rust_target }}/release \
              -czf dist/beskar-macos-${{ matrix.arch }}.tar.gz \
              beskar

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-package-${{ matrix.arch }}
          path: dist/beskar-macos-${{ matrix.arch }}.tar.gz

  windows-build-packages:
    name: Build Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path target\x86_64-pc-windows-msvc\release\beskar.exe `
            -DestinationPath dist\beskar-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-x86_64
          path: dist/beskar-windows-x86_64.zip

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - deb-build-packages
      - rpm-build-packages
      - macos-build-packages
      - windows-build-packages

    # Job-level permissions (override the workflow default for this job):
    #   contents     — create the release and upload assets
    #   id-token     — OIDC token for Sigstore keyless signing + provenance (#54, #56)
    #   attestations — write SLSA build-provenance attestations (#56)
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout source
        # Needed so the SBOM step can read Cargo.lock (#55).
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        # Flatten the per-arch build artifacts into a single dist/ directory so
        # signing, checksums, and the release upload all act on one location.
        run: |
          mkdir -p dist
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp -v {} dist/ \;
          echo "Release assets:"
          ls -l dist

      - name: Generate SBOM (CycloneDX)
        # #55 — syft reads Cargo.lock and lists every crate dependency.
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/beskar.cdx.json
          artifact-name: beskar.cdx.json

      - name: Generate SLSA build provenance
        # #56 — verifiable later with:
        #   gh attestation verify <file> --repo ${{ github.repository }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip

      - name: Generate SHA-256 checksums
        # #54 — one manifest over every published asset (incl. the SBOM).
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign assets (Sigstore keyless)
        # #54 — emit a verifiable signature bundle per asset, including the
        # checksum manifest. The glob is expanded once, so the freshly written
        # *.cosign.bundle files are not themselves signed.
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: |
          for f in *; do
            [ -f "$f" ] || continue
            echo "Signing $f"
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done
          ls -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/*.cosign.bundle
            dist/beskar.cdx.json
            dist/SHA256SUMS
          body: |
            ## Supply-chain verification

            Every artifact is signed (Sigstore keyless), checksummed, and carries
            SLSA build provenance. An SBOM (`beskar.cdx.json`, CycloneDX) lists all
            crate dependencies. See [`docs/release-verification.md`](https://github.com/${{ github.repository }}/blob/main/docs/release-verification.md).

            **Checksums**
            ```
            sha256sum -c SHA256SUMS
            ```

            **Signature** (example: the amd64 `.deb`)
            ```
            cosign verify-blob \
              --bundle beskar-debian-amd64.deb.cosign.bundle \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              beskar-debian-amd64.deb
            ```

            **Provenance**
            ```
            gh attestation verify beskar-debian-amd64.deb --repo ${{ github.repository }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
