[package]
name = "beskar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Beskar is a Rust CLI tool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
walkdir = "2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
postgres = "0.19.13"
openssl = "0.10"
postgres-openssl = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1.0.149"
anyhow = "1"
hex = "0.4"
# Pattern engine for the pre-embedding PII/secret redaction hooks (PRD §6.2
# E1.11). User-configured and built-in patterns are scrubbed from text before
# it is embedded, stored, or sent to a generation provider — see src/redact/.
regex = "1.12.3"
# Blocking HTTP server for `beskar serve` (PRD §6.3 E2.1). Chosen so the server
# reuses the existing blocking core (postgres + blocking reqwest) directly,
# rather than forcing an async runtime — see src/serve/.
tiny_http = "0.12.0"

# Optional document-format extractors, enabled via the `docx` / `pdf` features.
zip = { version = "2", optional = true }
quick-xml = { version = "0.40", optional = true }
pdf-extract = { version = "0.10", optional = true }

[features]
# Off by default: the stock build stays text-only (`.md` / `.txt`).
# Enable with e.g. `cargo build --features docx,pdf`.
docx = ["dep:zip", "dep:quick-xml"]
pdf = ["dep:pdf-extract"]

# FIPS 140-3 runtime mode (PRD §6.2 E1.9). Loads the OpenSSL 3 FIPS provider at
# startup and fails closed if it is unavailable; `beskar version` reports the
# state. Requires linking against an OpenSSL 3 build whose FIPS provider is
# installed and configured on the host — see docs/fips.md. No extra crates: the
# feature only changes runtime behavior, gated on `cfg(feature = "fips")`.
fips = []

# Build openssl from source on platforms where a system openssl is not
# reliably available (Windows, macOS). Linux still links dynamically so
# the .deb retains a libssl dependency.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }


[package.metadata.deb]
maintainer = "Evan Allen <evanallen13@github.com>"
section = "utils"
priority = "optional"

# Read by `cargo generate-rpm` (the release workflow's RPM job). `assets` is
# mandatory; name/version/license/summary are taken from `[package]`. With
# `--target <triple>`, `target/release/` is rewritten to `target/<triple>/release/`.
[package.metadata.generate-rpm]
summary = "Rust CLI for building and querying a local RAG corpus on PostgreSQL + pgvector"
assets = [
    { source = "target/release/beskar", dest = "/usr/bin/beskar", mode = "755" },
]
