[package]
name = "beskar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Beskar is a Rust CLI tool"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
walkdir = "2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
postgres = "0.19.13"
openssl = "0.10"
postgres-openssl = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1.0.149"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"


[package.metadata.deb]
maintainer = "Evan Allen <evanallen13@github.com>"
section = "utils"
priority = "optional"

[package.metadata.rpm]
name = "beskar"
release = "1"
summary = "Rust CLI tool"
description = "Beskar is a Rust-based command-line application."
license = "MIT"

[package.metadata.rpm.targets]
beskar = { path = "/usr/bin/beskar" }
